services:
  app:
    build: .
    container_name: atlasrh-api
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/atlasrh
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: mouad
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

  db:
    image: postgres:15-alpine
    container_name: atlasrh-db
    restart: always
    environment:
      POSTGRES_DB: atlasrh
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: mouad
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d atlasrh"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: